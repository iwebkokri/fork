name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Encryption key derivation must not change (known-answer test)
        run: node test/secretbox-kat.mjs
      - name: System Health calculations (percentiles, CPU / memory parsing, balance verdicts)
        run: npx ts-node --transpile-only test/system-health.test.ts
      - name: Registration and verification policy (instant / manual / automatic, force verification, Certn retries; with fakes)
        run: npx ts-node --transpile-only test/verification.test.ts
      - name: Money back (card charged at checkout is refunded on cancel / reject / refused order; unused payments; with fakes)
        run: npx ts-node --transpile-only test/payments-refund.test.ts
      - name: Maps providers (Mapbox / Google switch, road distances, map tiles, search area; with a stubbed network)
        run: npx ts-node --transpile-only test/maps.test.ts
      - name: Store types (profiles, filters, weight and basket maths, status words, stock bookkeeping with a fake database)
        run: npx ts-node --transpile-only test/store-types.test.ts
      - name: Demo places of every zone (unique names and merchants, menus, cuisines, tiers, zones, postal codes)
        run: npx ts-node --transpile-only test/demo-locations.test.ts
      - name: CORS allow-list (exact origins, https://*.example.com subdomain entries, look-alikes, the production rule)
        run: npx ts-node --transpile-only test/cors.test.ts
      - name: Unit tests - website settings (schema, validation, robots / sitemap / llms.txt / structured data generators)
        run: npx ts-node --transpile-only test/site.test.ts
      - name: Presence check ("are you still on your way?": asked at 2x the expected pickup time, unassigned without an answer; with fakes)
        run: npx ts-node --transpile-only test/driver-presence.test.ts

  # The production schema comes from migrations, so they must exactly match the entities: apply them to an empty database and
  # fail if TypeORM still sees a difference. Fix: npm run migration:generate -- src/database/migrations/<Name>  (commit the file)
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forksy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forksy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: forksy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply all migrations to an empty database
        run: npm run migration:run
      - name: Entities and migrations must agree
        run: npm run migration:check
      - name: OpenAPI file (docs/openapi) must be up to date
        run: |
          npm run openapi:export
          if [ -n "$(git status --porcelain -- ../docs/openapi)" ]; then
            git --no-pager diff --stat -- ../docs/openapi
            echo "docs/openapi is stale: run  cd backend && npm run openapi:export  and commit the result"
            exit 1
          fi

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      DISABLE_ESLINT_PLUGIN: "true"
      GENERATE_SOURCEMAP: "false"
      REACT_APP_API_URL: http://localhost:4000/api/v1
      REACT_APP_WS_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t forksy-api ./backend
      - name: Build web image
        run: docker build -t forksy-web --build-arg REACT_APP_API_URL=https://api.example.ca/api/v1 --build-arg REACT_APP_WS_URL=https://api.example.ca ./admin

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
